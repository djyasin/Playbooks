---
- name: Create temporary files with escape sequences and display them clearly
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create file with single-escaped sequences
      copy:
        content: |
          Normal line
          Single quote: \'
          Double quote: \"
          Backslash: \\
          Literal newline: \n
          Literal carriage return: \r
          Literal tab: \t
          End of single-escaped file
        dest: /tmp/escape_test_file_single.txt
        mode: '0644'

    - name: Create file with double-escaped sequences
      copy:
        content: |
          Normal line
          Double-escaped single quote: \\\'
          Double-escaped double quote: \\\"
          Double-escaped backslash: \\\\\
          Double-escaped newline: \\\\\\n
          Double-escaped carriage return: \\\\\\r
          Double-escaped tab: \\\\\\t
          End of double-escaped file
        dest: /tmp/escape_test_file_double.txt
        mode: '0644'

    - name: Display single-escaped file content
      shell: cat /tmp/escape_test_file_single.txt
      register: single_output
      changed_when: false

    - name: Display double-escaped file content
      shell: cat /tmp/escape_test_file_double.txt
      register: double_output
      changed_when: false

    - name: Print single-escaped file clearly
      debug:
        msg: |
          --- Single-Escaped File ---
          {{ single_output.stdout }}

    - name: Print double-escaped file clearly
      debug:
        msg: |
          --- Double-Escaped File ---
          {{ double_output.stdout }}

