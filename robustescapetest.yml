---
- name: Create temporary files with escape sequences and tail them
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create file with single-escaped sequences
      copy:
        content: |
          Normal line
          Single quote: \'
          Double quote: \"
          Backslash: \\
          Literal newline: \n
          Literal carriage return: \r
          Literal tab: \t
          End of single-escaped file
        dest: /tmp/escape_test_file_single.txt
        mode: '0644'
      register: single_file_result

    - name: Create file with double-escaped sequences
      copy:
        content: |
          Normal line
          Double-escaped single quote: \\\'
          Double-escaped double quote: \\\"
          Double-escaped backslash: \\\\
          Double-escaped newline: \\\\n
          Double-escaped carriage return: \\\\r
          Double-escaped tab: \\\\t
          End of double-escaped file
        dest: /tmp/escape_test_file_double.txt
        mode: '0644'
      register: double_file_result

    - name: Tail single-escaped file and show content
      command: tail --bytes 20480k /tmp/escape_test_file_single.txt
      register: single_tail_output
      changed_when: false

    - name: Tail double-escaped file and show content
      command: tail --bytes 20480k /tmp/escape_test_file_double.txt
      register: double_tail_output
      changed_when: false

    - name: Display single-escaped file content
      debug:
        msg: |
          --- Single-Escaped File ---
          {{ single_tail_output.stdout }}

    - name: Display double-escaped file content
      debug:
        msg: |
          --- Double-Escaped File ---
          {{ double_tail_output.stdout }}

