---
- name: Create temporary files with escape sequences and tail them
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create file with single-escaped sequences
      copy:
        content: |
          Normal line
          Single quote: \'
          Double quote: \"
          Backslash: \\
          Literal newline: \n
          Literal carriage return: \r
          Literal tab: \t
          End of single-escaped file
        dest: /tmp/escape_test_file_single.txt
        mode: '0644'
      register: single_file_result

    - name: Create file with double-escaped sequences
      copy:
        content: |
          Normal line
          Double-escaped single quote: \\\'
          Double-escaped double quote: \\\"
          Double-escaped backslash: \\\\
          Double-escaped newline: \\\\n
          Double-escaped carriage return: \\\\r
          Double-escaped tab: \\\\t
          End of double-escaped file
        dest: /tmp/escape_test_file_double.txt
        mode: '0644'
      register: double_file_result

    - name: Show created file paths
      debug:
        msg:
          - "Single-escaped file: {{ single_file_result.dest }}"
          - "Double-escaped file: {{ double_file_result.dest }}"

    - name: Run tail on single-escaped file
      command: tail --bytes 20480k /tmp/escape_test_file_single.txt
      register: single_tail_output

    - name: Run tail on double-escaped file
      command: tail --bytes 20480k /tmp/escape_test_file_double.txt
      register: double_tail_output

    - name: Show single-escaped file output (raw)
      debug:
        var: single_tail_output.stdout

    - name: Show single-escaped file output (lines)
      debug:
        var: single_tail_output.stdout_lines

    - name: Show double-escaped file output (raw)
      debug:
        var: double_tail_output.stdout

    - name: Show double-escaped file output (lines)
      debug:
        var: double_tail_output.stdout_lines


